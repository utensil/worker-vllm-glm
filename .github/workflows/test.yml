name: Test public GLM deployment artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test public template artifact
        run: |
          python -m pip install requests
          python -m unittest -v test_public_artifact.py
