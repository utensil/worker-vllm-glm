name: Build and publish GLM vLLM images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - patch_glm5next_processor.py
      - serverless/**
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" \
            "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Pod image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm-glm:latest
            ghcr.io/${{ github.repository_owner }}/worker-vllm-glm:glm-5.3-flash-nvfp4-v1
          provenance: false

      - name: Build and push Serverless image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serverless
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm-glm:glm-5.3-flash-nvfp4-serverless-v1
            ghcr.io/${{ github.repository_owner }}/worker-vllm-glm:glm-5.3-flash-nvfp4-serverless-b200-tp2-v1
            ghcr.io/${{ github.repository_owner }}/worker-vllm-glm:glm-5.3-flash-nvfp4-serverless-b200-tp2-cached-v1
          provenance: false
